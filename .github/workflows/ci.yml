name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[convert,dev,demo,publish]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
